<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">saihroo — Software Engineer</title>
  <desc id="heroDesc">Dark neon terminal banner with the name saihroo, a software engineer focused on full-stack, AI, mobile and game development.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.52" stop-color="#06111d"/>
      <stop offset="1" stop-color="#04121a"/>
    </linearGradient>
    <linearGradient id="name" x1="62" y1="160" x2="430" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5f3fc"/>
      <stop offset="0.42" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="0.48" stop-color="#164e63" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(1065 25) rotate(135) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(60 390) rotate(-45) scale(310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#22d3ee" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="terminalClip">
      <rect x="28" y="28" width="1144" height="304" rx="18"/>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      .float-a { animation: floatA 6s ease-in-out infinite; }
      .float-b { animation: floatB 7.5s ease-in-out infinite; }
      .float-c { animation: floatC 5.5s ease-in-out infinite; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .scan { animation: scan 9s linear infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
      @keyframes floatC { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.95; } }
      @keyframes scan { 0% { transform: translateY(-32px); } 100% { transform: translateY(324px); } }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowCyan)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowBlue)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="url(#border)" stroke-width="1.5"/>

  <!-- terminal chrome -->
  <g clip-path="url(#terminalClip)">
    <rect x="28" y="28" width="1144" height="304" fill="#040a12" fill-opacity="0.84"/>
    <rect class="scan" x="28" y="28" width="1144" height="30" fill="url(#scanGrad)" opacity="0.07"/>
  </g>
  <rect x="28" y="28" width="1144" height="304" rx="18" stroke="#155e75" stroke-opacity="0.72"/>
  <path d="M28 74H1172" stroke="#164e63" stroke-opacity="0.7"/>
  <circle cx="56" cy="51" r="5.5" fill="#ff5f57"/>
  <circle cx="76" cy="51" r="5.5" fill="#febc2e"/>
  <circle cx="96" cy="51" r="5.5" fill="#28c840"/>
  <text x="600" y="56" text-anchor="middle" class="mono" font-size="12" fill="#64748b" letter-spacing="0.5">saihroo@github: ~/profile</text>
  <text x="1146" y="56" text-anchor="end" class="mono" font-size="11" fill="#475569">zsh</text>

  <!-- prompt + name -->
  <text x="64" y="111" class="mono" font-size="14" fill="#e2e8f0">
    <tspan fill="#22d3ee">saihroo@github</tspan><tspan fill="#64748b">:~$</tspan><tspan dx="7">whoami</tspan>
  </text>

  <text x="62" y="196" class="mono" font-size="80" font-weight="700" letter-spacing="-2.5" fill="#22d3ee" opacity="0.3" filter="url(#bigGlow)">saihroo</text>
  <text x="62" y="196" class="mono" font-size="80" font-weight="700" letter-spacing="-2.5" fill="url(#name)">saihroo</text>

  <text x="66" y="232" class="mono" font-size="16" font-weight="600" letter-spacing="6.5" fill="#a5f3fc">SOFTWARE ENGINEER</text>
  <text x="66" y="259" class="mono" font-size="13.5" fill="#94a3b8">Full-Stack  ·  AI  ·  Mobile  ·  Game Dev</text>

  <!-- status lines -->
  <text x="66" y="293" class="mono" font-size="13" fill="#64748b">
    <tspan fill="#22d3ee">&gt;</tspan><tspan dx="7" fill="#475569">building</tspan><tspan dx="8" fill="#e2e8f0">KOMA — Manga Motion Studio</tspan>
  </text>
  <text x="66" y="316" class="mono" font-size="13" fill="#64748b">
    <tspan fill="#22d3ee">&gt;</tspan><tspan dx="7" fill="#475569">stack</tspan><tspan dx="8" fill="#e2e8f0">TypeScript · Kotlin · Python · C# · Luau</tspan><tspan class="cursor" dx="5" fill="#22d3ee">_</tspan>
  </text>

  <!-- right-side code mark -->
  <g opacity="0.9">
    <circle cx="1000" cy="186" r="132" stroke="#22d3ee" stroke-opacity="0.12" stroke-dasharray="3 11" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 186" to="360 1000 186" dur="55s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="186" r="104" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>

    <g class="pulse" filter="url(#softGlow)">
      <text x="1000" y="245" text-anchor="middle" class="mono" font-size="150" font-weight="700" fill="#22d3ee" opacity="0.22">&lt;/&gt;</text>
    </g>

    <text x="1000" y="245" text-anchor="middle" class="mono" font-size="150" font-weight="700" fill="url(#name)" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.2">&lt;/&gt;</text>
  </g>

  <text class="mono float-a" x="800" y="92" font-size="17" fill="#67e8f9" opacity="0.38">{ }</text>
  <text class="mono float-b" x="1140" y="82" font-size="15" fill="#818cf8" opacity="0.3">=&gt;</text>
  <text class="mono float-c" x="1133" y="302" font-size="20" fill="#22d3ee" opacity="0.34">;</text>
  <text class="mono float-b" x="820" y="302" font-size="11" fill="#64748b" opacity="0.5">0x1F</text>
  <circle cx="1130" cy="150" r="2" fill="#a5f3fc" opacity="0.6" class="float-c"/>
  <circle cx="866" cy="212" r="1.6" fill="#67e8f9" opacity="0.45" class="float-a"/>
  <circle cx="1150" cy="232" r="1.4" fill="#818cf8" opacity="0.5" class="float-b"/>

  <!-- bottom accent -->
  <rect x="28" y="345" width="1144" height="1" fill="#164e63" opacity="0.55"/>
  <rect y="344" width="180" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="x" values="-180;1200" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
